<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak - Web Portofolio</title>
    <link rel="stylesheet" href="style-1.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Hubungi Saya</h1>
            <p>Silakan tinggalkan pesan melalui formulir di bawah ini</p>
        </header>
        <nav>
            <div class="logo">MyWebsite</div>
            <div class="menu">
                <ul>
                    <li><a href="beranda-1.html">Beranda</a></li>
                    <li><a href="data diri-1.html">Data Diri</a></li>
                    <li><a href="kontak.-1html.html">Kontak</a></li>
                </ul>
            </div>
        </nav>
        <section>
            <article>
                <h2>Formulir Kontak</h2>
                <br>
                <form action="#" method="post" class="contact-form">
                    <div class="form-group">
                        <label for="nama">Nama Lengkap:</label>
                        <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda..." required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" placeholder="Masukkan email Anda..." required>
                    </div>

                    <div class="form-group">
                        <label for="pesan">Pesan:</label>
                        <textarea id="pesan" name="pesan" rows="5" placeholder="Tulis pesan Anda di sini..." required></textarea>
                    </div>

                    <button type="submit" class="btn-submit">Kirim Pesan</button>
                </form>
            </article>

            <aside>
                <h3>Informasi Kontak</h3>
                <br>
                <p><strong>Email:</strong><br> muhammadipan1201@gmail.com</p>
                <br>
                <p><strong>Lokasi:</strong><br> Indonesia</p>
                <br>
                <h3>Menu Pintas</h3>
                <br>
                <ul class="link-list">
                    <li><a href="beranda-1.html">Ke Beranda</a></li>
                    <li><a href="data diri-1.html">Ke Data Diri</a></li>
                </ul>
            </aside>
        </section>

        <footer>
            <p>&copy; PROFIL SAYA</p>
        </footer>
    </div>

</body>
</html>
